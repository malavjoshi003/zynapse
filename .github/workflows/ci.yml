name: Zynapse CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    name: Check application
    runs-on: ubuntu-latest

    env:
      MONGO_URI: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=1000&connectTimeoutMS=1000

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q main.py app

      - name: Start application and test responses
        shell: bash
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/zynapse.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=false
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/test-data > /tmp/products.json; then
              READY=true
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/zynapse.log
              exit 1
            fi

            sleep 2
          done

          if [ "$READY" != "true" ]; then
            cat /tmp/zynapse.log
            exit 1
          fi

          python -c "import json; data=json.load(open('/tmp/products.json')); assert data['total_products'] > 0, 'No products loaded'; print(data)"
          curl --fail --silent http://127.0.0.1:8000/ -o /tmp/homepage.html